services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voytek
      POSTGRES_USER: voytek
      POSTGRES_PASSWORD: voytek_local_only
    ports:
      - "5432:5432"
    volumes:
      - voytek-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voytek -d voytek"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - voytek-redis-data:/data

  api-1: &api
    build:
      context: .
      dockerfile: apps/backend/src/Voytek.Api/Dockerfile
    environment:
      ConnectionStrings__VoytekDatabase: Host=postgres;Port=5432;Database=voytek;Username=voytek;Password=voytek_local_only
      Jwt__Issuer: ${Jwt__Issuer:-voytek}
      Jwt__Audience: ${Jwt__Audience:-voytek-api}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in your environment}
      Redis__Configuration: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  api-2:
    <<: *api

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2

volumes:
  voytek-postgres-data:
  voytek-redis-data:
